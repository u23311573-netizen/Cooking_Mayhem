<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chef Bolinho — Boss Rush</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;background:#1b1230;font-family:"Courier New",monospace;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
#w{position:relative;width:min(100vw,calc(100vh*16/9),960px);aspect-ratio:16/9;font-size:clamp(11px,2.1vw,20px)}
canvas{width:100%;height:100%;display:block;background:#000;image-rendering:pixelated}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.p{background:rgba(30,15,60,.93);border:4px solid #ffd23f;border-radius:0;box-shadow:6px 6px 0 #000;padding:1.5em 2.5em;text-align:center;max-width:92%;max-height:96%;overflow:auto}
h1{margin:0 0 .4em;font-size:2.6em;color:#ffd23f;text-shadow:3px 3px 0 #e33;line-height:1}
h1 small{color:#fff;font-size:.6em}h2{margin:.2em 0 .5em;color:#ffd23f}
p{margin:.4em 0;line-height:1.4}
.p button{display:block;margin:.5em auto;min-width:60%;padding:.55em 1.2em;font:inherit;font-weight:bold;background:#ffd23f;border:4px solid #111;border-radius:0;box-shadow:4px 4px 0 #000;cursor:pointer;color:#222}
.p button:hover{background:#fff}.p button:disabled{opacity:.4;cursor:not-allowed}.p .s{background:#ccc}
kbd{background:#fff;color:#111;border-radius:0;padding:0 .4em;font-weight:bold}
label{display:block;margin:.8em 0;text-align:left}label input{width:100%}
#pz{position:absolute;top:2%;right:2%;width:2.6em;height:2.6em;border-radius:0;border:3px solid #fff;background:rgba(0,0,0,.4);color:#fff;font-size:1em;cursor:pointer}

</style></head><body data-m="menu">
<div id="w"><canvas id="c" width="800" height="450"></canvas>
<div id="ui"></div><button id="pz" onclick="pausa()">⏸</button>
<div id="tc"><div><b data-k="L">◀</b><b data-k="R">▶</b></div><div><b data-k="F">🍳</b><b data-k="U">⤒</b></div></div></div>
<script>
// ===== Chef Bolinho: Boss Rush — jogo original, tudo em um arquivo =====
const $=id=>document.getElementById(id),cv=$('c'),sc=cv.getContext('2d'),bf=document.createElement('canvas'),g=bf.getContext('2d'),ui=$('ui'),W=800,H=450,GY=380;
bf.width=400;bf.height=225;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const NOMES=['Pudim de Limão','Sorvete Fantasma','Hambúrguer Robô'];
// ----- progresso e volumes salvos no navegador -----
let save={un:1,done:[0,0,0],mv:70,sv:80};
try{Object.assign(save,JSON.parse(localStorage.getItem('cbr')||'{}'))}catch(e){}
const gravar=()=>{try{localStorage.setItem('cbr',JSON.stringify(save))}catch(e){}};
// ----- som (gerado pelo navegador, sem arquivos) -----
let ac,mg,sg;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();sg=ac.createGain();mg.connect(ac.destination);sg.connect(ac.destination);vol()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume()}
function vol(){if(ac){mg.gain.value=save.mv/100*.6;sg.gain.value=save.sv/100}}
function tone(f,d,t,v,f2,dest){if(!ac)return;const o=ac.createOscillator(),e=ac.createGain(),n=ac.currentTime;o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);e.gain.setValueAtTime(v||.2,n);e.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(e);e.connect(dest);o.start();o.stop(n+d)}
const som=(f,d,t,v,f2)=>tone(f,d,t,v,f2,sg);
let st=0;setInterval(()=>{if(!ac||mode=='pause')return;st++;const b=[110,98,123][inGame?stage:0];
 if(st%4==0)tone(b*(st%16<8?1:1.33),.25,'triangle',.5,0,mg); // baixo
 if(st%2)tone(b*4*Math.pow(2,[0,3,5,7,10,12][(st*5+(st>>2))%6]/12),.12,'square',.1,0,mg)},190); // melodia
// ----- estado do jogo -----
let mode='menu',inGame=false,stage=0,T=0,shake=0,P,B,shots=[],eps=[],parts=[],k={};
const setM=m=>{mode=m;document.body.dataset.m=m};
const scr=h=>{ui.style.display='flex';ui.innerHTML='<div class=p>'+h+'</div>'},hide=()=>{ui.style.display='none'};
// ----- caixas de colisão -----
const hitC=e=>{const dx=Math.max(Math.abs(e.x-P.x)-14,0),dy=Math.max(Math.abs(e.y-(P.y-25))-25,0);return dx*dx+dy*dy<e.r*e.r};
const ov=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
const pb=()=>[P.x-14,P.y-50,28,50],bb=b=>b.fl?[b.x-b.w/2,b.y-b.h/2,b.w,b.h]:[b.x-b.w/2,b.y-b.h,b.w,b.h];
// ----- chefes: estrutura única, só mudam os ataques -----
function novoChefe(s){const d=[{hp:40,w:100,h:90,idle:1.2,seq:[1,0,1,2],x:620,y:GY},
 {hp:55,w:90,h:110,idle:1,seq:[0,1,0,1],x:600,y:190,fl:1},
 {hp:80,w:130,h:166,idle:.8,seq:[0,1,2,3,0,3,1,2],x:650,y:GY}][s];
 return Object.assign({n:NOMES[s],max:d.hp,ph:'idle',t:1.2,ai:0,flash:0,al:1,dead:0,bx:d.x,at:0,f:0,f2:0,beam:0},d)}
function tiro(x,y,tx,ty,sp,r,c,ang,dl,hm){const a=Math.atan2(ty-y,tx-x)+(ang||0);eps.push({x,y,r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c,dl:dl||0,hm:hm||0,life:6})}
function onda(x,d,sp){eps.push({x,y:GY-14,r:16,vx:d*sp,vy:0,c:['#a8f03c','#8ee6b4','#ffc933'][stage],dl:0,hm:0,life:3,w:1})}
const volley=b=>{for(let i=-1;i<2;i++)tiro(b.x,b.y,P.x,P.y-25,270,13,'#9f9',i*.22);som(250,.2,'sine',.3,500)};
// cada ataque: k=nome, w=tempo de aviso, d=duração, s=início, u=atualização
const A=[[
 {k:'dash',w:.7,d:.9,body:1,s(b){b.dir=P.x<b.x?-1:1},u(b,dt){b.x+=b.dir*430*dt;if(b.x<70||b.x>W-70){b.x=cl(b.x,70,W-70);b.dir*=-1}}}, // investida
 {k:'bub',w:.6,d:.7,s(b){for(let i=-1;i<2;i++)tiro(b.x,b.y-50,P.x,P.y-25,240,12,'#7d3',i*.25);som(300,.2,'sine',.3,600)},u(){}}, // bolhas tóxicas
 {k:'jump',w:.7,d:1.3,body:1,s(b){b.vy=-720;b.jx=(P.x-b.x)/.8},u(b,dt){b.vy+=1800*dt;b.y+=b.vy*dt;b.x+=b.jx*dt;
  if(b.y>=GY&&b.vy>0){b.y=GY;b.vy=0;b.jx=0;if(!b.f){b.f=1;shake=14;onda(b.x-40,-1,260);onda(b.x+40,1,260);som(90,.3,'sawtooth',.4,40)}}}} // salto
],[
 {k:'orb',w:.6,d:1,s(b){volley(b)},u(b){if(!b.f&&b.at>.5){b.f=1;volley(b)}}}, // projéteis
 {k:'storm',w:.5,d:2.4,s(b){for(let i=0;i<7;i++)eps.push({x:rnd(50,W-50),y:-30,r:16,vx:0,vy:420,c:'#8f8',dl:.4+i*.28,hm:0,life:9,mk:1})},u(){}} // tempestade
],[
 {k:'pickle',w:.7,d:1.2,s(b){const h=[20,48,90].sort(()=>Math.random()-.5);h.forEach((y,i)=>eps.push({x:b.x-70,y:GY-y,r:11,vx:-400,vy:0,c:'#6aa83a',dl:i*.3,hm:0,life:4,pk:1}));som(260,.15,'square',.25,160)},u(){}}, // picles
 {k:'lob',w:.7,d:1,s(b){for(let i=-1;i<2;i++){const x0=b.x-40,y0=b.y-150,tx=cl(P.x+i*90,30,W-30),T2=1.1,gg=900;eps.push({x:x0,y:y0,r:12,vx:(tx-x0)/T2,vy:(GY-y0-.5*gg*T2*T2)/T2,g:gg,tx,c:'#d83a2a',dl:(i+1)*.2,hm:0,life:5})}som(200,.2,'sine',.3,400)},u(){}}, // molho em arco
 {k:'rocket',w:.7,d:1.1,s(b){eps.push({x:b.x-100,y:GY-34,r:18,vx:-460,vy:0,c:'#e8923a',dl:.3,hm:0,life:3,fi:1});som(150,.3,'sawtooth',.3,60)},u(){}}, // soco foguete
 {k:'leap',w:.8,d:1.5,s(b){b.vy=-900;b.jx=(cl(P.x,150,W-110)-b.x)/1},u(b,dt){b.vy+=1800*dt;b.y+=b.vy*dt;b.x+=b.jx*dt;if(b.y>=GY&&b.vy>0){b.y=GY;b.vy=0;b.jx=0;if(!b.f){b.f=1;shake=18;onda(b.x-70,-1,300);onda(b.x+70,1,300);som(70,.4,'square',.5,30)}}}} // pulo esmagador
]];
function bossUpd(dt){const b=B;
 if(stage==1){b.y=190+Math.sin(T*2.2)*18;b.x=b.bx+Math.sin(T*1.2)*60}if(stage==2&&b.ph=='idle')b.x+=cl(b.bx-b.x,-70*dt,70*dt);
 if(b.dead){b.dead+=dt;b.beam=0;if(Math.random()<.5)boom(b.x+rnd(-b.w/2,b.w/2),b.y-rnd(0,b.h),'#fd3');if(b.dead>1.8)fim(1);return}
 b.flash=Math.max(0,b.flash-dt);
 if(b.ph=='idle'){b.t-=dt;if(b.t<=0){b.cur=A[stage][b.seq[b.ai++%b.seq.length]];b.ph='warn';b.t=b.cur.w}}
 else if(b.ph=='warn'){b.t-=dt;if(b.t<=0){b.ph='act';b.at=0;b.f=0;b.f2=0;b.cur.s(b)}}
 else{b.at+=dt;b.cur.u(b,dt);if(b.at>=b.cur.d){b.ph='idle';b.t=b.idle;b.beam=0;b.al=1;if(stage!=1){b.y=GY;b.vy=0}}}}
// ----- jogador -----
function updP(dt){const p=P;p.t+=dt;p.oy=p.y;p.inv=Math.max(0,p.inv-dt);p.cd-=dt;p.fl=Math.max(0,p.fl-dt);
 if(p.dead){p.dead+=dt;p.vy+=1800*dt;p.y=Math.min(GY+40,p.y+p.vy*dt);if(p.dead>1.3)fim(0);return}
 const d=(k.R?1:0)-(k.L?1:0);p.vx=d*250;if(d)p.face=d;p.x=cl(p.x+p.vx*dt,24,W-24);
 if(k.U&&p.y>=GY){p.vy=-640;som(400,.12,'square',.15,700)}
 p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>=GY){p.y=GY;p.vy=0}
 if(k.F&&p.cd<=0){p.cd=.2;p.fl=.1;shots.push({x:p.x+p.face*26,y:p.y-30,vx:p.face*640,life:1.3,n:(p.n=((p.n||0)+1)%4)});som(500,.08,'triangle',.15,300)}}
function hurt(){if(P.inv>0||P.dead)return;P.hp--;P.inv=1.5;shake=10;som(180,.25,'sawtooth',.4,60);
 for(let i=0;i<8;i++)parts.push({x:P.x,y:P.y-25,vx:rnd(-200,200),vy:rnd(-300,0),life:.5,c:'#f44'});
 if(P.hp<=0){P.dead=.01;P.vy=-450;som(300,.8,'sawtooth',.4,40)}}
function boom(x,y,c){for(let i=0;i<5;i++)parts.push({x,y,vx:rnd(-180,180),vy:rnd(-250,50),life:rnd(.3,.7),c})}
function upd(dt){T+=dt;shake=Math.max(0,shake-dt*40);updP(dt);bossUpd(dt);solido();
 for(const s of shots){s.x+=s.vx*dt;s.life-=dt;
  if(!B.dead&&!(B.fl&&B.al<.5)){const c=bb(B);if(s.x>c[0]&&s.x<c[0]+c[2]&&s.y>c[1]&&s.y<c[1]+c[3]){s.life=0;B.hp--;B.flash=.1;som(220,.06,'square',.2,120);boom(s.x,s.y,'#fff');
   if(B.hp<=0){B.dead=.01;eps=[];shake=20;som(200,.8,'sawtooth',.5,30)}}}}
 shots=shots.filter(s=>s.life>0&&s.x>-20&&s.x<W+20);
 for(const e of eps){
  if(e.dl>0){e.dl-=dt;if(e.dl<=0&&e.ms)som(300,.2,'sawtooth',.2,150);continue}
  if(e.hm>0){e.hm-=dt;const c=Math.atan2(e.vy,e.vx);let d=Math.atan2(P.y-25-e.y,P.x-e.x)-c;d=Math.atan2(Math.sin(d),Math.cos(d));const n=c+cl(d,-2.2*dt,2.2*dt),sp=e.ms?250:Math.hypot(e.vx,e.vy);e.vx=Math.cos(n)*sp;e.vy=Math.sin(n)*sp}
  if(e.g)e.vy+=e.g*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;
  if(e.y>GY-6&&!e.w){e.life=0;boom(e.x,GY,e.c)}
  if(!P.dead&&P.inv<=0&&hitC(e)){hurt();e.life=0}}
 eps=eps.filter(e=>e.life>0&&e.x>-60&&e.x<W+60&&e.y<H+40);
 if(!B.dead&&!P.dead&&P.inv<=0){
  if(B.ph=='act'&&B.cur.body){const c=bb(B);if(ov(pb(),[c[0]+12,c[1]+12,c[2]-24,c[3]-12]))hurt()}
  if(B.beam&&ov(pb(),[0,GY-70,B.x-75,35]))hurt()}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt}parts=parts.filter(p=>p.life>0)}
// ===== desenho em pixel art: tudo é desenhado num quadro pequeno (400x225) e ampliado sem suavizar =====
const q2=v=>Math.round(v/2)*2;
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(q2(x),q2(y),Math.max(2,q2(w)),Math.max(2,q2(h)))};
function elp(x,y,rx,ry,f,s){const d=(a,b,c)=>{g.fillStyle=c;for(let j=-b;j<b;j+=2){const w=a*Math.sqrt(Math.max(0,1-((j+1)/b)**2));g.fillRect(q2(x-w),q2(y+j),Math.max(2,q2(w*2)),2)}};if(s!==0)d(rx+2,ry+2,'#111');d(rx,ry,f)}
function rct(x,y,w,h,f){g.fillStyle='#111';g.fillRect(q2(x)-2,q2(y)-2,q2(w)+4,q2(h)+4);px(x,y,w,h,f)}
function trap(x,y,w1,w2,h,f,s){const d=(y0,hh,a,b,c)=>{g.fillStyle=c;for(let j=0;j<hh;j+=2){const w=a+(b-a)*j/hh;g.fillRect(q2(x-w/2),q2(y0+j),Math.max(2,q2(w)),2)}};if(s!==0)d(y-2,h+4,w1+4,w2+4,'#111');d(y,h,w1,w2,f)}
function bmp(r,x,y,s,pal){r.forEach((row,j)=>{for(let i=0;i<row.length;i++){const c=pal[row[i]];if(c){g.fillStyle=c;g.fillRect(x+i*s,y+j*s,s,s)}}})}
function txt(t,x,y,sz,c){g.font='bold '+sz+'px monospace';g.textAlign='center';g.fillStyle='#111';for(const[dx,dy]of[[-2,0],[2,0],[0,-2],[0,2]])g.fillText(t,x+dx,y+dy);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
const HR=['.111.111.','122212221','122222221','122222221','.1222221.','..12221..','...121...','....1....'];
const mx=(a,b,t)=>{const f=i=>Math.round(parseInt(a.substr(1+i*2,2),16)*(1-t)+parseInt(b.substr(1+i*2,2),16)*t);return'rgb('+f(0)+','+f(1)+','+f(2)+')'};
function fundo(s){const c=[['#38c6d9','#0b4f7a','#e8c46a'],['#5b3a8c','#1a0f3a','#4a3a6a'],['#7a3b2e','#2b1a1a','#555a66']][s];
 for(let i=0;i<10;i++){g.fillStyle=mx(c[0],c[1],i/9);g.fillRect(0,i*38,W,38)}
 for(let L=0;L<2;L++){const col=L?'rgba(0,0,0,.28)':'rgba(255,255,255,.1)'; // camadas com parallax
  for(let i=0;i<7;i++){const x=((i*150-T*(L?28:12))%1050+1050)%1050-120,h=60+((i*37+L*20)%70)*(L?1.2:1.6);
   if(s==0)elp(x,GY-h/2+10,26+L*8,h/2+10,col,0);else px(x,GY-h-20,22+L*10,h+20,col)}}
 if(s<2){g.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<14;i++){const z=4+(i%3)*2;g.fillRect(q2((i*61+Math.sin(T+i)*10)%W),q2(H-((T*30+i*53)%H)),z,z)}}
 g.fillStyle=c[2];g.fillRect(0,GY,W,H-GY);g.fillStyle='rgba(0,0,0,.14)';for(let r=0;r<3;r++)for(let i=0;i<20;i++)if((i+r)%2)g.fillRect(i*40,GY+r*24,40,24);
 g.fillStyle='#111';g.fillRect(0,GY-4,W,8)}
// ----- cozinheiro (herói) -----
function hero(p){const mv=Math.abs(p.vx)>1&&p.y>=GY,air=p.y<GY-1,hu=p.inv>1.1;
 g.save();g.translate(Math.round(p.x),Math.round(p.y));
 if(p.dead)g.globalAlpha=Math.max(0,1-p.dead/1.2);else if(p.inv>0&&((T*20)|0)%2)g.globalAlpha=.4;
 g.scale(p.face,1);const bob=mv?((T*14)|0)%2*2:((T*3)|0)%2*2,lg=mv?(((T*14)|0)%2?6:-6):0,lu=air?-6:0;
 rct(-14+lg,-8+lu,12,8,'#4a2c2c');rct(2-lg,-8+lu,12,8,'#4a2c2c'); // sapatos
 rct(-12+lg,-20+lu,8,12,'#3b2a2a');rct(4-lg,-20+lu,8,12,'#3b2a2a'); // calça
 rct(-14,-42-bob,28,24,'#f4ecd8');px(-2,-36-bob,4,4,'#555');px(-2,-28-bob,4,4,'#555'); // jaleco
 rct(-10,-46-bob,20,6,'#b82a3a'); // lenço vermelho
 rct(-12,-58-bob,24,14,'#f7c59a'); // rosto
 rct(-14,-64-bob,28,8,'#6b3a22');px(-18,-58-bob,4,6,'#6b3a22');px(14,-60-bob,4,6,'#6b3a22'); // cabelo
 px(-8,-54-bob,4,6,'#111');px(2,-54-bob,4,6,'#111');px(-10,-58-bob,6,2,'#111');px(2,-58-bob,6,2,'#111'); // olhos e sobrancelhas
 px(0,-48-bob,hu?6:4,hu?4:2,'#a55'); // boca
 rct(-12,-72-bob,24,8,'#efe0c6');elp(-8,-80-bob,8,6,'#f6ecd8');elp(8,-80-bob,8,6,'#f6ecd8');elp(0,-84-bob,8,6,'#f6ecd8'); // chapéu
 rct(8,-40-bob,14,8,'#f4ecd8');rct(20-(p.fl?4:0),-42-bob,8,10,'#f7c59a'); // braço e punho
 g.restore()}
// ----- chefe 1: pudim de limão -----
function boss0(b,f){const C=a=>f||a,bob=((T*5)|0)%2*2,a=b.ph=='act'&&b.cur.k=='jump'&&b.vy<0?-16:0;g.translate(0,-bob);
 trap(0,-64,66,92,62,C('#74d130'));px(-44,-14,88,10,C('#4aa31f'));
 elp(0,-66,36,10,C('#a8f03c'));for(const d of[-34,-14,6,26])px(d,-62,8,(d==-34||d==26)?22:14,C('#a8f03c')); // gosma escorrendo
 elp(0,-84,16,10,C('#e6f08a'));px(-1,-92,2,16,'#fff6b0');px(-10,-85,20,2,'#fff6b0');px(10,-92,14,6,'#2f8a2a'); // fatia de limão
 rct(-26,-46,18,10,'#fff3cf');rct(8,-46,18,10,'#fff3cf');px(-16,-44,4,8,'#111');px(12,-44,4,8,'#111');
 for(let i=0;i<4;i++){px(-28+i*6,-56+i*2,6,4,'#111');px(22-i*6,-56+i*2,6,4,'#111')}
 px(-52,-44+a,10,4,C('#74d130'));elp(-58,-44+a,10,10,C('#8be03a'));px(42,-44+a,10,4,C('#74d130'));elp(58,-44+a,10,10,C('#8be03a'));
 px(-70,-70,6,6,'#a8f03c');px(68,-62,6,6,'#a8f03c')}
// ----- chefe 2: sorvete fantasma (flutua) -----

 else hero({x:200,y:GY,vx:0,vy:0,face:1,inv:0,fl:0});

 '<h2>Vidas</h2><p>Você tem 4 ❤❤❤❤<br>Cada ataque que te acerta tira 1 vida.<br>Sem vidas, a fase recomeça. Vença o chefe para liberar a próxima!</p>'];
